<!doctype html>

<body>
<x-dc>
<helmet>

<div style="width: 390px; height: 960px; box-sizing: border-box; background: #F5F7FF; color: #1E2340; font-family: 'Noto Sans KR', system-ui, sans-serif; display: flex; flex-direction: column;">

</div>

<div style="display: flex; align-items: center; gap: 12px">
<div style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: #4458E8; flex-shrink: 0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.5A8 8 0 1 1 21 12z"/></svg></div>

<div style="font-size: 14px; line-height: 1.55; color: #3D4468"><span>{{typeDesc}}</span> <span style="{{statusStyle}}">{{status}}</span></div>
<div style="font-size: 13px; line-height: 1.5; color: #5F6588">{{reason}}</div>

<div style="padding-top: 10px; border-top: 1px solid #D5DBFA; font-size: 12px; line-height: 1.5; color: #5F6588">참고용 안내이며, 최종 판단은 각 플랫폼 정책에 따라요.</div>
</div>
<div style="padding: 18px; border-radius: 16px; background: #FFF6E6; border: 1px solid #FBE3B5; display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 15px; font-weight: 700; color: #7A4200">확인해 볼 점</div>
<sc-for list="{{checks}}" as="chk" hint-placeholder-count="3"><div style="display: flex; gap: 10px; font-size: 14px; line-height: 1.55"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#D97706" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><path d="M5 12l5 5 9-10"/></svg><div>{{chk.t}}</div></div></sc-for>
</div>
<div style="padding: 18px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E3E7F7; box-shadow: 0 2px 10px rgba(68,88,232,0.08); display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 15px; font-weight: 700">관련 플랫폼 정책</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 15px; font-weight: 700">배달의민족</div><div style="font-size: 13px; color: #5F6588">리뷰운영정책 · 2024-10-08 시행</div></div>
<a href="Report.dc.html" style="display: flex; align-items: center; min-height: 44px; font-size: 14px; font-weight: 700; color: #4458E8; text-decoration: none; flex-shrink: 0">자세히 보기</a>
</div>
</div>
<div style="padding: 18px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E3E7F7; box-shadow: 0 2px 10px rgba(68,88,232,0.08); display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 15px; font-weight: 700">다음 단계</div>
<a href="Reply.dc.html" style="display: flex; align-items: flex-start; gap: 12px; text-decoration: none; color: #1E2340"><div style="display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; background: #4458E8; color: #FFFFFF; font-size: 14px; font-weight: 700; flex-shrink: 0">1</div><div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 15px; font-weight: 700">답변 초안 만들기</div><div style="font-size: 13px; line-height: 1.5; color: #5F6588">말투를 고르고 빈칸을 채워 복사해요.</div></div></a>
<a href="Report.dc.html" style="display: flex; align-items: flex-start; gap: 12px; text-decoration: none; color: #1E2340"><div style="display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; background: #4458E8; color: #FFFFFF; font-size: 14px; font-weight: 700; flex-shrink: 0">2</div><div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 15px; font-weight: 700">{{step2Title}}</div><div style="font-size: 13px; line-height: 1.5; color: #5F6588">{{step2Desc}}</div></div></a>
</div>
<div style="margin-top: auto; padding-bottom: 28px; display: flex; flex-direction: column; gap: 10px">
<a href="Reply.dc.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 12px; background: #4458E8; color: #FFFFFF; font-size: 17px; font-weight: 700; text-decoration: none">답변 초안 만들기</a>
<a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border-radius: 12px; border: 1px solid #E3E7F7; background: #FFFFFF; color: #1E2340; font-size: 15px; font-weight: 700; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E2340" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>처음부터 다시하기</a>
<div style="font-size: 12px; line-height: 1.5; color: #5F6588; text-align: center">참고용 안내이며, 최종 판단은 각 플랫폼 정책에 따라요.</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":960}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const TYPES = {
delay: { label: '배달 지연', title: '배달이 늦어 음식이 식은 데 대한 불만이에요', pills: ['배달 지연', '음식 온도', '재주문 의사 없음'], desc: '이런 유형은 사과와 개선 약속을 담은 답변으로 풀어가는 경우가 많아요.', status: '신고대상은 아닙니다.', tone: 'no', reason: '이유: 욕설·비방·개인정보 노출이 없고, 배달 경험에 대한 평가예요.', checks: ['주문 시각과 도착 시각을 주문 기록에서 확인해 보세요.', '라이더 배차가 늦었다면, 플랫폼에 문의할 수 있는 경로가 있는지 살펴보세요.', '같은 시간대에 비슷한 불만이 더 있었는지 확인해 보세요.'], step2Title: '신고 전 체크리스트 (선택)', step2Desc: '단순 불만이나 주관적 평가는 게시중단 요청이 받아들여지지 않을 수 있어요.' },
taste: { label: '맛 불만', title: '음식 맛에 대한 아쉬움을 말하는 리뷰예요', pills: ['맛', '주관적 평가'], desc: '이런 유형은 반박하지 않고, 의견에 감사하며 개선 의지를 보이는 답변이 어울려요.', status: '신고대상은 아닙니다.', tone: 'no', reason: '이유: 맛에 대한 주관적 평가예요.', checks: ['같은 메뉴에 비슷한 평가가 반복되는지 확인해 보세요.', '해당 메뉴의 조리 기준과 간을 다시 살펴보세요.', '취향 차이로 보이더라도 반박하는 표현은 피하세요.'], step2Title: '신고 전 체크리스트 (선택)', step2Desc: '주관적 평가는 게시중단 요청이 받아들여지지 않을 수 있어요.' },
foreign: { label: '이물질·위생', title: '음식에서 이물질이 나왔다는 리뷰예요', pills: ['이물질', '위생', '고객 안전'], desc: '이런 유형은 먼저 사과하고, 상황을 확인할 수 있도록 연락을 유도하는 답변이 필요해요.', status: '신고 여부를 판단하기 전에 상황부터 확인하세요.', tone: 'check', reason: '이유: 고객 안전과 관련된 내용일 수 있어요.', checks: ['해당 주문의 조리·포장 기록을 확인해 보세요.', '고객이 연락할 수 있는 경로를 답변에 안내하세요.', '원인을 단정하는 표현은 피하세요.'], step2Title: '신고 전 체크리스트 (선택)', step2Desc: '상황 확인이 끝난 뒤에 필요한지 살펴보세요.' },
abuse: { label: '욕설·비방', title: '욕설이나 비방 표현이 섞인 리뷰예요', pills: ['욕설', '비방', '감정적 표현'], desc: '이런 유형은 감정적으로 반박하지 않고 차분하게 답하는 편이 안전해요.', status: '신고 검토가 가능할 수 있어요.', tone: 'check', reason: '이유: 욕설·비방 표현이 감지됐어요. 해당 표현을 적어 두고 신고 전 체크리스트를 확인하세요.', checks: ['문제가 되는 표현을 그대로 적어 두세요.', '화면 캡쳐와 리뷰 번호를 저장해 두세요.', '주문 기록과 일치하는 리뷰인지 확인하세요.'], step2Title: '신고 전 체크리스트 확인 (권장)', step2Desc: '요청서에 침해 표현을 적어야 하는 플랫폼이 있어요.' },
verify: { label: '사실 확인 필요', title: '주문한 적 없다는 등 사실 확인이 필요한 리뷰예요', pills: ['사실 확인', '주문 기록'], desc: '이런 유형은 주문 기록을 확인한 뒤 사실에 맞게 차분히 답하는 것이 먼저예요.', status: '주문 기록을 확인한 뒤에 판단하세요.', tone: 'check', reason: '이유: 확인 전에는 신고 대상 여부를 말하지 않아요.', checks: ['주문 일시·메뉴·결제 기록을 찾아보세요.', '리뷰 속 주장과 기록이 일치하는지 비교하세요.', '허위 같은 단정 표현은 쓰지 마세요.'], step2Title: '신고 전 체크리스트 (선택)', step2Desc: '기록을 확인한 뒤에 필요한지 살펴보세요.' },
stars: { label: '별점만', title: '별점만 남기고 글이 없는 리뷰예요', pills: ['별점만', '내용 없음'], desc: '이런 유형은 짧게 감사 인사를 하고 연락 창구를 알려 주는 답변이 어울려요.', status: '원칙적으로 신고대상은 아닙니다.', tone: 'no', reason: '이유: 세 배달앱 정책 모두 별점만 있는 리뷰는 원칙적으로 게시중단 요청 대상에서 제외해요.', checks: ['주문 기록으로 어떤 주문인지 확인해 보세요.', '불편한 점이 있었는지 연락 창구를 열어 두세요.', '이유를 추측해서 답변하지 마세요.'], step2Title: '신고 전 체크리스트 (선택)', step2Desc: '별점만 있는 리뷰는 요청이 받아들여지지 않는 경우가 많아요.' }
};
const ORDER = ['delay', 'taste', 'foreign', 'abuse', 'verify', 'stars'];
const curT = s.type || 'delay';
const showT = !!s.showTypes;
const td = TYPES[curT];
const TON = 'min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #4458E8; background: #EEF1FF; color: #3547C9; font-family: inherit; font-size: 14px; font-weight: 700';
const TOFF = 'min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #E3E7F7; background: #FFFFFF; color: #1E2340; font-family: inherit; font-size: 14px; font-weight: 400';
const typeVals = {
typeChips: ORDER.map((k) => ({ label: TYPES[k].label, pressed: k === curT ? 'true' : 'false', style: k === curT ? TON : TOFF, pick: () => this.setState({ type: k, showTypes: false }) })),
showTypes: showT,
toggleTypes: () => this.setState({ showTypes: !showT }),
toggleLabel: showT ? '닫기' : '유형이 맞지 않나요? 바꾸기',
typeTitle: td.title,
pills: td.pills.map((t) => ({ t: t })),
typeDesc: td.desc,
status: td.status,
statusStyle: td.tone === 'no' ? 'font-weight: 700; color: #3547C9' : 'font-weight: 700; color: #7A4200',
reason: td.reason,
checks: td.checks.map((t) => ({ t: t })),
step2Title: td.step2Title,
step2Desc: td.step2Desc
};
return typeVals;
}
}
</script>
</body>
