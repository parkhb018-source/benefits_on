<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>처음 화면</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4458E8}
</style>
</helmet>
<div style="width: 390px; height: 880px; box-sizing: border-box; background: #FFFFFF; color: #1E2340; font-family: 'Noto Sans KR', system-ui, sans-serif; display: flex; flex-direction: column;">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 0 24px">
<div style="font-size: 24px; font-weight: 700; color: #1E2340">혜택<span style="color: #4458E8">on</span></div>
<button type="button" aria-label="메뉴" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid #D5DBFA; background: #FFFFFF"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4458E8" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 8h14M5 12h14M5 16h14"/></svg></button>
</div>
<div style="padding: 26px 24px 0; display: flex; align-items: center; justify-content: space-between; gap: 8px">
<div style="display: flex; flex-direction: column; gap: 12px">
<h1 style="margin: 0; font-size: 28px; line-height: 1.4; font-weight: 700">사장님의<br>리뷰 대응을<br>도와드립니다.</h1>
</div>
<svg width="116" height="124" viewBox="0 0 116 124" fill="none" aria-hidden="true" style="flex-shrink: 0">
<rect x="10" y="8" width="82" height="100" rx="12" fill="#EEF1FF" stroke="#4458E8" stroke-width="2.5"/>
<rect x="24" y="26" width="34" height="6" rx="3" fill="#4458E8"/>
<rect x="24" y="42" width="54" height="5" rx="2.5" fill="#A9B4F2"/>
<rect x="24" y="55" width="48" height="5" rx="2.5" fill="#A9B4F2"/>
<rect x="24" y="68" width="40" height="5" rx="2.5" fill="#A9B4F2"/>
<path d="M82 70l22 8v18c0 14-10 22-22 27-12-5-22-13-22-27V78z" fill="#4458E8"/>
<path d="M72 98l8 8 14-16" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
</div>
<p style="margin: 0; padding: 14px 24px 0; font-size: 15px; line-height: 1.6; color: #5F6588">리뷰를 캡쳐하거나 붙여넣기만 하면 답변과<br>확인할 점(신고대상)을 바로 알려드려요</p>
<div style="padding: 26px 20px 0; display: flex; flex-direction: column; gap: 14px">
<a href="Paste.dc.html" style="display: flex; align-items: center; gap: 16px; padding: 22px 20px; border-radius: 18px; background: #4458E8; color: #FFFFFF; text-decoration: none; box-shadow: 0 6px 16px rgba(68,88,232,0.25)">
<div style="display: flex; align-items: center; justify-content: center; width: 54px; height: 54px; border-radius: 14px; border: 1.5px solid rgba(255,255,255,0.75); background: rgba(255,255,255,0.16); flex-shrink: 0"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M9 11h6M9 15h6"/></svg></div>
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 19px; font-weight: 700">리뷰 붙여넣기</div>
<div style="font-size: 14px; line-height: 1.5; color: #F0F2FF">복사한 글을 붙여넣어 바로 분석해요.</div>
</div>
</a>
<a href="Capture.dc.html" style="display: flex; align-items: center; gap: 16px; padding: 22px 20px; border-radius: 18px; background: #EEF1FF; border: 1px solid #D5DBFA; color: #1E2340; text-decoration: none">
<div style="display: flex; align-items: center; justify-content: center; width: 54px; height: 54px; border-radius: 14px; background: #4458E8; flex-shrink: 0"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l1.6-2.4h6.8L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.4"/></svg></div>
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 19px; font-weight: 700">리뷰 캡쳐하기</div>
<div style="font-size: 14px; line-height: 1.5; color: #3D4468">이미지를 분석해서 리뷰 내용을 자동으로 읽어 드려요.</div>
</div>
</a>
<div style="font-size: 13px; line-height: 1.55; color: #5F6588; padding: 0 4px">캡쳐한 글자는 틀리게 읽힐 수 있어요. 다음 화면에서 직접 확인하고 고칠 수 있어요.</div>
</div>
<div style="margin-top: auto; padding: 0 24px 12px">
<div style="font-size: 12px; line-height: 1.5; color: #5F6588; text-align: center">참고용 안내이며, 최종 판단은 각 플랫폼 정책에 따라요.</div>
</div>
<sc-if value="{{hasNotice}}" hint-placeholder-val="{{ false }}"><div role="status" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 20px 10px; padding: 12px 16px; border-radius: 12px; background: #1E2340; color: #FFFFFF; font-size: 14px; line-height: 1.5"><span>{{notice}}</span><button type="button" aria-label="안내 닫기" onClick="{{closeNotice}}" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin: -10px -10px -10px 0; border: none; background: transparent; color: #FFFFFF; font-family: inherit; font-size: 22px">×</button></div></sc-if>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #E3E7F7; padding: 6px 8px 14px">
<a href="https://benefitson.org" aria-label="혜택on 무료도구로 돌아가기" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 64px; color: #1E2340; font-size: 12px; font-weight: 700; line-height: 1.3; text-align: center; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1E2340" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>무료도구<br>돌아가기</a>
<button type="button" onClick="{{openRecord}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 64px; border: none; background: transparent; color: #5F6588; font-family: inherit; font-size: 12px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5F6588" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>기록<span style="padding: 1px 8px; border-radius: 999px; background: #EEF1FF; color: #3D4468; font-size: 11px; font-weight: 500">준비중</span></button>
<button type="button" onClick="{{openStats}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 64px; border: none; background: transparent; color: #5F6588; font-family: inherit; font-size: 12px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5F6588" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-7"/></svg>통계<span style="padding: 1px 8px; border-radius: 999px; background: #EEF1FF; color: #3D4468; font-size: 11px; font-weight: 500">준비중</span></button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":880}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
return {
notice: s.notice || '',
hasNotice: !!s.notice,
openRecord: () => this.setState({ notice: '기록 기능은 준비 중이에요. 곧 만나요.' }),
openStats: () => this.setState({ notice: '통계 기능은 준비 중이에요. 곧 만나요.' }),
closeNotice: () => this.setState({ notice: '' })
};
}
}
</script>
</body>
</html>
