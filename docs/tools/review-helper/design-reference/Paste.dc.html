<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>리뷰 붙여넣기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4458E8}
</style>
</helmet>
<div style="width: 390px; height: 880px; box-sizing: border-box; background: #FFFFFF; color: #1E2340; font-family: 'Noto Sans KR', system-ui, sans-serif; display: flex; flex-direction: column;">
<div style="display: flex; align-items: center; gap: 4px; padding: 12px 20px 8px 12px">
<a href="Main.dc.html" aria-label="처음 화면으로" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1E2340" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
<div style="font-size: 18px; font-weight: 700">리뷰 붙여넣기</div>
</div>
<div style="padding: 8px 20px 0; display: flex; flex-direction: column; gap: 16px; flex-grow: 1">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 20px; line-height: 1.4; font-weight: 700">받은 리뷰를 붙여넣어 주세요</div>
<div style="font-size: 14px; line-height: 1.55; color: #5F6588">복사한 글을 붙여넣으면 답변 초안과 확인할 점을 정리해 드려요.</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; justify-content: space-between"><label for="review" style="font-size: 14px; font-weight: 700">리뷰 내용</label><button type="button" onClick="{{clearText}}" style="min-height: 44px; padding: 0 4px; border: none; background: transparent; color: #4458E8; font-family: inherit; font-size: 14px; font-weight: 700">지우기</button></div>
<sc-if value="{{hasText}}" hint-placeholder-val="{{ true }}"><textarea id="review" style="width: 100%; height: 160px; box-sizing: border-box; padding: 14px 16px; border: 1px solid #E3E7F7; border-radius: 14px; background: #FFFFFF; box-shadow: 0 2px 10px rgba(68,88,232,0.08); color: #1E2340; font-family: inherit; font-size: 16px; line-height: 1.5; resize: none">배달이 너무 늦게 와서 음식이 다 식었어요. 다시는 안 시킬 것 같아요.</textarea></sc-if>
<sc-if value="{{noText}}" hint-placeholder-val="{{ false }}"><div style="display: flex; flex-direction: column; gap: 4px"><textarea id="review" placeholder="여기에 리뷰를 붙여넣어 주세요" style="width: 100%; height: 160px; box-sizing: border-box; padding: 14px 16px; border: 1px solid #E3E7F7; border-radius: 14px; background: #FFFFFF; box-shadow: 0 2px 10px rgba(68,88,232,0.08); color: #1E2340; font-family: inherit; font-size: 16px; line-height: 1.5; resize: none"></textarea><button type="button" onClick="{{fillSample}}" style="align-self: flex-start; min-height: 44px; padding: 0 4px; border: none; background: transparent; color: #4458E8; font-family: inherit; font-size: 14px; font-weight: 700">예시 리뷰 넣어 보기</button></div></sc-if>
</div>
<div style="padding: 16px; border-radius: 14px; background: #EEF1FF; display: flex; gap: 12px">
<div style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; background: #4458E8; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 11v6"/><path d="M12 7h.01"/></svg></div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 14px; font-weight: 700; color: #3547C9">스크린샷에서 글자 복사하기</div>
<div style="font-size: 14px; line-height: 1.55">아이폰: 스크린샷 속 글자를 길게 눌러 복사해요.</div>
<div style="font-size: 14px; line-height: 1.55">갤럭시: 스크린샷에서 '텍스트 추출'을 눌러 복사해요.</div>
</div>
</div>
<a href="Capture.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 12px; border: 1px solid #4458E8; background: #FFFFFF; color: #4458E8; font-size: 15px; font-weight: 700; text-decoration: none">복사가 어렵다면 리뷰 캡쳐하기</a>
<div style="margin-top: auto; padding-bottom: 28px; display: flex; flex-direction: column; gap: 10px">
<a href="Confirm.dc.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 12px; background: #4458E8; color: #FFFFFF; font-size: 17px; font-weight: 700; text-decoration: none">분석하기</a>
<div style="font-size: 12px; line-height: 1.5; color: #5F6588; text-align: center">참고용 안내이며, 최종 판단은 각 플랫폼 정책에 따라요.</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":880}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
return {
hasText: !s.cleared,
noText: !!s.cleared,
clearText: () => this.setState({ cleared: true }),
fillSample: () => this.setState({ cleared: false })
};
}
}
</script>
</body>
</html>
