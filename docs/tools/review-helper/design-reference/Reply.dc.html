<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>답변 초안</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4458E8}
</style>
</helmet>
<div style="width: 390px; height: 1000px; box-sizing: border-box; background: #F5F7FF; color: #1E2340; font-family: 'Noto Sans KR', system-ui, sans-serif; display: flex; flex-direction: column;">
<div style="display: flex; align-items: center; gap: 4px; padding: 12px 20px 8px 12px">
<a href="Result.dc.html" aria-label="이전 화면" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1E2340" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
<div style="font-size: 18px; font-weight: 700">답변 초안</div>
</div>
<div style="padding: 4px 20px 0; display: flex; flex-direction: column; gap: 14px; flex-grow: 1">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: baseline; justify-content: space-between"><div style="font-size: 15px; font-weight: 700">리뷰 유형</div><div style="font-size: 13px; color: #5F6588">옆으로 넘겨 보세요</div></div>
<div style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -20px; padding: 2px 20px 6px"><sc-for list="{{typeChips}}" as="chip" hint-placeholder-count="8"><button type="button" aria-pressed="{{chip.pressed}}" onClick="{{chip.pick}}" style="{{chip.style}}">{{chip.label}}</button></sc-for></div>
</div>
<sc-if value="{{notCaution}}" hint-placeholder-val="{{ true }}"><div style="display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: 14px; background: #EEF1FF; border: 1px solid #D5DBFA"><div style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; background: #4458E8; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 11v6"/><path d="M12 7h.01"/></svg></div><div style="font-size: 15px; line-height: 1.5; font-weight: 700; color: #3547C9">{{banner}}</div></div></sc-if><sc-if value="{{isCaution}}" hint-placeholder-val="{{ false }}"><div style="display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: 14px; background: #FFF6E6; border: 1px solid #FBE3B5"><div style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; background: #D97706; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 11v6"/><path d="M12 7h.01"/></svg></div><div style="font-size: 15px; line-height: 1.5; font-weight: 700; color: #7A4200">{{banner}}</div></div></sc-if>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 15px; font-weight: 700">답변 스타일</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px"><sc-for list="{{chips}}" as="chip" hint-placeholder-count="3"><button type="button" aria-pressed="{{chip.pressed}}" onClick="{{chip.pick}}" style="{{chip.style}}">{{chip.label}}</button></sc-for></div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; justify-content: space-between">
<div style="font-size: 15px; font-weight: 700">답변 미리보기</div>
<div style="font-size: 13px; color: #5F6588">{{blankLabel}}</div>
</div>
<div style="padding: 16px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E3E7F7; box-shadow: 0 2px 10px rgba(68,88,232,0.08); white-space: pre-line; font-size: 16px; line-height: 1.75; color: #1E2340"><sc-for list="{{segs}}" as="seg" hint-placeholder-count="5"><sc-if value="{{seg.isBlank}}" hint-placeholder-val="{{ false }}"><span style="background: #FFF1C2; color: #5C3D00; border-radius: 4px; padding: 1px 4px; font-weight: 500">{{seg.t}}</span></sc-if><sc-if value="{{seg.notBlank}}" hint-placeholder-val="{{ true }}"><span>{{seg.t}}</span></sc-if></sc-for></div>
</div>
<div style="font-size: 13px; line-height: 1.55; color: #5F6588">노란 칸은 가게 상황에 맞게 직접 채워 주세요. 사실과 다른 사과나 고객을 탓하는 표현은 피하는 게 좋아요.</div>
<div style="margin-top: auto; padding-bottom: 28px; display: flex; flex-direction: column; gap: 10px">
<button type="button" onClick="{{copy}}" style="height: 54px; border-radius: 12px; border: none; background: #4458E8; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 700">{{copyLabel}}</button>
<a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border-radius: 12px; border: 1px solid #E3E7F7; background: #FFFFFF; color: #1E2340; font-size: 15px; font-weight: 700; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E2340" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>처음부터 다시하기</a>
<div style="font-size: 12px; line-height: 1.5; color: #5F6588; text-align: center">복사한 뒤 각 플랫폼 사장님 앱의 답글 칸에 붙여넣으세요.</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const TPL = {"T01": ["안녕하세요, [가게 이름]입니다.\n배달이 늦어져 오래 기다리시게 한 점 진심으로 죄송합니다. 기다리시는 동안 얼마나 불편하셨을지 생각하니 송구한 마음입니다.\n이번 지연은 [지연 사유] 때문이었고, [개선 내용]으로 같은 일이 반복되지 않도록 하겠습니다.\n소중한 의견 감사드립니다.", "안녕하세요, [가게 이름]입니다. 배달이 늦어 불편을 드려 죄송합니다. [개선 내용]으로 바로잡겠습니다. 의견 감사합니다.", "[가게 이름]입니다. 소중한 시간을 내어 후기를 남겨 주셔서 감사합니다.\n오래 기다리셨을 시간을 생각하면 마음이 무겁습니다. 배달 시간은 저희가 가장 신경 써야 할 부분인데 부족했습니다.\n[개선 내용]부터 바로 점검하겠습니다. 다시 기회를 주신다면 더 나은 모습으로 보답하겠습니다."], "T02": ["안녕하세요, [가게 이름]입니다.\n음식이 식은 채로 도착해 마음 편히 드시지 못하셨다니 죄송합니다. 따뜻한 상태로 전해드리는 것이 저희 몫인데 부족했습니다.\n[개선 내용]으로 포장과 출고 과정을 다시 살펴보겠습니다.\n말씀해 주셔서 감사합니다.", "안녕하세요, [가게 이름]입니다. 음식이 식어서 도착해 죄송합니다. [개선 내용]으로 보완하겠습니다. 의견 감사합니다.", "[가게 이름]입니다. 후기를 남겨 주셔서 감사합니다.\n정성껏 만든 음식이 식은 채로 도착했다니 저희도 속상합니다. 기대하신 만큼 따뜻하게 드시지 못한 점 죄송합니다.\n[개선 내용]을 바로 적용해 보겠습니다. 다시 기회를 주시면 더 따뜻하게 보내드리겠습니다."], "T03": ["안녕하세요, [가게 이름]입니다.\n기대하신 맛과 달라 아쉬우셨다니 죄송합니다. 솔직한 의견을 남겨 주셔서 감사합니다.\n말씀해 주신 [메뉴명]은 [개선 내용]을 통해 다시 살펴보겠습니다.\n다음에는 더 만족하실 수 있도록 노력하겠습니다.", "안녕하세요, [가게 이름]입니다. 맛이 입에 맞지 않아 아쉬우셨다니 죄송합니다. 말씀 주신 [메뉴명]은 [개선 내용]으로 살펴보겠습니다. 감사합니다.", "[가게 이름]입니다. 맛에 대해 솔직하게 말씀해 주셔서 감사합니다.\n입맛은 저마다 달라 쉽지 않지만, 기대에 못 미쳤다는 말씀은 가볍게 듣지 않겠습니다.\n[메뉴명]의 맛은 [개선 내용]으로 다시 점검하겠습니다."], "T04": ["안녕하세요, [가게 이름]입니다.\n양이나 가격이 기대에 못 미쳐 아쉬우셨다니 죄송합니다.\n[메뉴명]의 구성은 [확인 결과]이고, 안내가 부족했던 부분은 [개선 내용]으로 보완하겠습니다.\n의견 감사드립니다.", "안녕하세요, [가게 이름]입니다. 양과 가격에 아쉬움을 드려 죄송합니다. [메뉴명] 구성은 [확인 결과]이며, [개선 내용]으로 보완하겠습니다.", "[가게 이름]입니다. 솔직한 후기 감사합니다.\n가격에 비해 만족스럽지 못하셨다는 말씀, 무겁게 받아들이겠습니다. [메뉴명] 구성과 안내를 [개선 내용]으로 다시 살펴보겠습니다.\n다음에는 만족하실 수 있도록 노력하겠습니다."], "T05": ["안녕하세요, [가게 이름]입니다.\n주문하신 [메뉴명]이 빠지거나 다르게 전달됐다니 정말 죄송합니다.\n확인해 보니 [확인 결과]였고, [조치 내용]으로 도와드리겠습니다. [연락 방법]으로 연락 주시면 바로 처리하겠습니다.\n같은 일이 없도록 [개선 내용]을 하겠습니다.", "안녕하세요, [가게 이름]입니다. 주문과 다르게 전달돼 죄송합니다. [연락 방법]으로 연락 주시면 [조치 내용]으로 바로 도와드리겠습니다.", "[가게 이름]입니다. 후기를 남겨 주셔서 감사합니다.\n기다려서 받은 음식이 주문과 달랐다니 얼마나 실망스러우셨을지 죄송한 마음입니다.\n[연락 방법]으로 연락 주시면 [조치 내용]으로 도와드리겠습니다. 포장 단계의 확인 방법은 [개선 내용]으로 바꾸겠습니다."], "T06": ["안녕하세요, [가게 이름]입니다.\n음식에서 불쾌한 일을 겪으셨다니 정말 죄송합니다. 놀라고 불편하셨을 점 깊이 사과드립니다.\n정확한 상황 확인을 위해 [연락 방법]으로 연락 주시면 바로 확인하고 [조치 내용]으로 도와드리겠습니다.\n재발 방지를 위해 [개선 내용]을 하겠습니다.", "안녕하세요, [가게 이름]입니다. 불쾌한 경험을 드려 정말 죄송합니다. [연락 방법]으로 연락 주시면 바로 확인하겠습니다. [개선 내용]으로 재발을 막겠습니다.", "[가게 이름]입니다. 이런 일을 겪게 해드려 깊이 사과드립니다.\n음식을 만드는 사람으로서 가장 있어서는 안 될 일이라고 생각합니다. [연락 방법]으로 연락 주시면 상황을 정확히 확인하고 [조치 내용]으로 도와드리겠습니다.\n[개선 내용]으로 다시 점검하겠습니다."], "T07": ["안녕하세요, [가게 이름]입니다.\n포장이 제대로 되지 않아 음식이 쏟아지거나 흐트러진 채 도착해 죄송합니다. 받으시고 많이 속상하셨을 것 같습니다.\n[개선 내용]으로 포장 방법을 보완하겠습니다. [연락 방법]으로 연락 주시면 [조치 내용]으로 도와드리겠습니다.", "안녕하세요, [가게 이름]입니다. 포장 상태가 좋지 않아 죄송합니다. [개선 내용]으로 보완하겠습니다. [연락 방법]으로 연락 주세요.", "[가게 이름]입니다. 후기 감사합니다.\n정성껏 담은 음식이 흐트러진 채 도착했다니 저희도 마음이 아픕니다. 포장은 끝까지 책임져야 할 부분인데 부족했습니다.\n[개선 내용]을 바로 적용하겠습니다."], "T08": ["안녕하세요, [가게 이름]입니다.\n요청사항을 제대로 반영하지 못해 죄송합니다. 확인해 보니 [확인 결과]였고, 앞으로는 [개선 내용]으로 꼼꼼히 확인하겠습니다.\n다음에는 요청하신 대로 준비해 드리겠습니다.", "안녕하세요, [가게 이름]입니다. 요청사항을 놓쳐 죄송합니다. [개선 내용]으로 꼼꼼히 확인하겠습니다.", "[가게 이름]입니다. 말씀해 주셔서 감사합니다.\n주문하실 때 남겨 주신 요청이 지켜지지 않았다니 마음이 편치 않으셨을 것 같습니다. 죄송합니다.\n[확인 결과]를 바탕으로 [개선 내용]을 하겠습니다."], "T09": ["안녕하세요, [가게 이름]입니다.\n응대 과정에서 불편을 드려 정말 죄송합니다. 기분이 상하셨을 점 헤아려 보겠습니다.\n상황을 확인해 [개선 내용]을 하겠습니다. 말씀해 주셔서 감사합니다.", "안녕하세요, [가게 이름]입니다. 응대에서 불편을 드려 죄송합니다. [개선 내용]으로 살피겠습니다. 의견 감사합니다.", "[가게 이름]입니다. 솔직하게 말씀해 주셔서 감사합니다.\n찾아 주신 손님께 편안한 응대를 드리지 못해 죄송합니다. 가볍게 넘기지 않고 [개선 내용]으로 바로 점검하겠습니다."], "T10": ["안녕하세요, [가게 이름]입니다.\n배달 과정에서 불편을 겪으셨다니 죄송합니다. 음식을 보내는 입장에서 저희도 안타깝습니다.\n말씀하신 내용은 [확인 결과]였고, [연락 방법]을 통해 배달 쪽에 전달해 개선을 요청하겠습니다.\n불편을 드려 다시 한번 사과드립니다.", "안녕하세요, [가게 이름]입니다. 배달 과정에서 불편을 드려 죄송합니다. 내용은 배달 쪽에 전달해 개선을 요청하겠습니다.", "[가게 이름]입니다. 후기 감사합니다.\n음식이 손님께 닿는 마지막 순간까지 신경 써야 하는데 불편을 드렸습니다. 죄송합니다.\n말씀해 주신 내용은 [연락 방법]으로 전달하고 [확인 결과]를 바탕으로 개선을 요청하겠습니다."], "T11": ["안녕하세요, [가게 이름]입니다.\n주문해 주시고 별점을 남겨 주셔서 감사합니다. 혹시 불편하셨던 점이 있었다면 [연락 방법]으로 편하게 말씀해 주세요. 소중한 의견으로 참고하겠습니다.", "안녕하세요, [가게 이름]입니다. 별점 남겨 주셔서 감사합니다. 불편하신 점은 [연락 방법]으로 말씀해 주세요.", "[가게 이름]입니다. 주문과 별점 모두 감사합니다. 어떤 점이 아쉬우셨는지 알려 주시면 큰 도움이 됩니다. [연락 방법]으로 편하게 말씀해 주세요."], "T12": ["안녕하세요, [가게 이름]입니다.\n불편한 경험을 드린 것 같아 죄송합니다. 말씀해 주신 의견은 개선에 참고하겠습니다.\n자세한 상황을 알려 주시면 확인하겠습니다. [연락 방법]으로 연락 주세요.", "안녕하세요, const TONES = ['정중하게', '간결하게', '진정성 있게'];
const ONT = 'min-height: 48px; padding: 0 8px; border-radius: 12px; border: 1.5px solid #4458E8; background: #EEF1FF; color: #3547C9; font-family: inherit; font-size: 15px; font-weight: 700';
const OFFT = 'min-height: 48px; padding: 0 8px; border-radius: 12px; border: 1px solid #E3E7F7; background: #FFFFFF; color: #1E2340; font-family: inherit; font-size: 15px; font-weight: 400';
const ONC = 'flex-shrink: 0; white-space: nowrap; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #4458E8; background: #EEF1FF; color: #3547C9; font-family: inherit; font-size: 14px; font-weight: 700';
const OFFC = 'flex-shrink: 0; white-space: nowrap; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #E3E7F7; background: #FFFFFF; color: #1E2340; font-family: inherit; font-size: 14px; font-weight: 400';
const tid = s.tid || 'T01';
const tone = s.tone === undefined ? 0 : s.tone;
const meta = META.find((m) => m.id === tid);
const text = TPL[tid][tone];
const segs = text.split(/(\[[^\]]+\])/).filter(Boolean).map((t) => ({ t: t, isBlank: t.charAt(0) === '[', notBlank: t.charAt(0) !== '[' }));
const blanks = segs.filter((g) => g.isBlank).length;
const done = () => this.setState({ copied: true });
const replyVals = {
chips: TONES.map((l, i) => ({ label: l, pressed: i === tone ? 'true' : 'false', style: i === tone ? ONT : OFFT, pick: () => this.setState({ tone: i, copied: false }) })),
segs: segs,
blankLabel: '빈칸 ' + blanks + '곳',
banner: meta.banner, isCaution: meta.caution, notCaution: !meta.caution,
copyLabel: s.copied ? '복사했어요' : '답변문 복사하기',
copy: () => {
try { navigator.clipboard.writeText(text).then(done, done); } catch (e) { done(); }
}
};
replyVals.typeChips = META.map((m) => ({ label: m.label, pressed: m.id === tid ? 'true' : 'false', style: m.id === tid ? ONC : OFFC, pick: () => this.setState({ tid: m.id, copied: false }) }));
return replyVals;
}
}
</script>
